model_list:
  - model_name: free-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: free-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: free-cerebras
    litellm_params:
      model: cerebras/llama-3.3-70b
      api_key: os.environ/CEREBRAS_API_KEY
  - model_name: free-openrouter
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  fallbacks:
    - free-gemini: [free-groq, free-cerebras, free-openrouter]
    - free-groq: [free-cerebras, free-openrouter, free-gemini]
    - free-cerebras: [free-openrouter, free-gemini, free-groq]
    - free-openrouter: [free-gemini, free-groq, free-cerebras]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 60
  allowed_fails: 1
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
