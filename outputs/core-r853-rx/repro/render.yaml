# Render Blueprint — reprodução RX / ODONTOCA (SPEC-935-R882)
#
# NOTA (SPEC-935-R885): a Render só procura `render.yaml` na RAIZ do repositório,
# então o blueprint CANÔNICO (com `rootDir`) está em `./render.yaml` (raiz). Este
# arquivo aqui é a MESMA definição mantida junto do app, como referência
# (contexto de build = este diretório) e para os testes — não é auto-detectado.
#
# Contexto de build (onde ficam o Dockerfile e o código):
#   outputs/core-r853-rx/repro
# Alternativamente, crie o serviço manualmente no painel Render apontando esse
# diretório como "Root Directory".
services:
  - type: web
    name: odontoca-rx
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Demo: engine stub (sem pesos). Nossa rede: só o que o container precisa.
      - key: RX_ENGINE
        value: stub
      # Render injeta PORT; 0.0.0.0 é obrigatório para receber tráfego externo.
      - key: RX_HOST
        value: 0.0.0.0
      - key: RX_ADMIN_DB
        value: /data/admin.db
# Persistência opcional (paga): descomente e dimensione para manter o SQLite.
#    disks:
#      - name: dados
#        mountPath: /data
#        sizeGB: 1
