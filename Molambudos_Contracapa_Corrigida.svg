<stop offset="100%" stop-color="#060402"/>
</radialGradient>
</defs>
<rect x="0" y="0" width="1050" height="1900" fill="url(#bgB)"/>
<rect x="26" y="26" width="998" height="1848" fill="none" stroke="#8a6d3b" stroke-width="3"/>
<rect x="48" y="48" width="954" height="1730" fill="none" stroke="#6b5330" stroke-width="1"/>
<circle cx="26" cy="26" r="7" fill="#8a6d3b"/><circle cx="1024" cy="26" r="7" fill="#8a6d3b"/><circle cx="26" cy="1874" r="7" fill="#8a6d3b"/><circle cx="1024" cy="1874" r="7" fill="#8a6d3b"/>

<rect x="60" y="76" width="64" height="22" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="1" fill="#cbb17a">PT-BR</text>
<text x="140" y="93" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#d8c9a3">HÁ LUGARES ONDE A DOR NÃO PEDE LICENÇA PARA EXISTIR.</text>
<text x="140" y="115" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#d8c9a3">E HÁ HISTÓRIAS QUE O TEMPO ENTERRA... MAS NÃO APAGA.</text>

<rect x="60" y="134" width="64" height="22" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="1" fill="#cbb17a">EN</text>
<text x="140" y="151" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#bfa876">THERE ARE PLACES WHERE PAIN DOES NOT ASK PERMISSION TO EXIST.</text>
<text x="140" y="173" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#bfa876">AND THERE ARE STORIES THAT TIME BURIES... BUT CANNOT ERASE.</text>

<rect x="60" y="192" width="64" height="22" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="1" fill="#cbb17a">ZH</text>
<text x="140" y="211" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="16" fill="#bfa876">有些地方，痛苦无需请求许可便能存在。</text>
<text x="140" y="235" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="16" fill="#bfa876">也有些故事，被时间掩埋……却无法抹去。</text>

<line x1="60" y1="262" x2="990" y2="262" stroke="#4a3a22" stroke-width="1" stroke-dasharray="1 8"/>

<rect x="60" y="298" width="64" height="20" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="1" fill="#cbb17a">PT-BR</text>
<g font-family="Georgia, serif" font-size="13.5" fill="#cfc2a0">
<text x="60" y="337">Molambudos revela, em forma de diário, a jornada de Joaquim Antônio</text>
<text x="60" y="354">Correia — o Paciente 1.260 —, uma criança sertaneja que sobreviveu</text>
<text x="60" y="371">à fome, à sede e ao abandono durante a seca de 1915, confinada nos</text>
<text x="60" y="388">"Currais do Governo", campos de concentração criados para isolar e</text>
<text x="60" y="405">silenciar milhares de retirantes. Décadas depois, internado no</text>
<text x="60" y="422">Hospital Colônia de Barbacena, Joaquim escreve suas memórias, seus</text>
<text x="60" y="439">delírios e suas verdades em um diário que permaneceu escondido</text>
<text x="60" y="456">junto ao seu corpo por 62 anos. Ao ser exumado em 1979, o diário</text>
<text x="60" y="473">veio à tona. Mas com ele, algo mais também despertou.</text>
</g>

<rect x="60" y="497" width="64" height="20" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="512" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="1" fill="#cbb17a">EN</text>
<g font-family="Georgia, serif" font-size="13.5" fill="#b7a780">
<text x="60" y="536">Molambudos reveals, in diary form, the journey of Joaquim Antônio</text>
<text x="60" y="553">Correia — Patient 1,260 —, a child from Brazil's backlands who</text>
<text x="60" y="570">survived hunger, thirst, and abandonment during the drought of</text>
<text x="60" y="587">1915, confined in the "Government Corrals," concentration camps</text>
<text x="60" y="604">created to isolate and silence thousands of displaced people.</text>
<text x="60" y="621">Decades later, committed to the Hospital Colônia de Barbacena,</text>
<text x="60" y="638">Joaquim records his memories, delusions, and truths in a diary</text>
<text x="60" y="655">that remained hidden beside his body for 62 years. When he was</text>
<text x="60" y="672">exhumed in 1979, the diary resurfaced. But with it, something</text>
<text x="60" y="689">else awoke.</text>
</g>

<rect x="60" y="712" width="64" height="20" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="92" y="727" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="1" fill="#cbb17a">ZH</text>
<g font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="14" fill="#b7a780">
<text x="60" y="752">《Molambudos》以日记体形式揭示若阿金·安东尼奥·</text>
<text x="60" y="774">科雷亚——1,260号病人——的旅程，</text>
<text x="60" y="796">他是巴西内陆荒原的一名孩子，</text>
<text x="60" y="818">在1915年大旱期间熬过饥饿、干渴与遗弃，</text>
<text x="60" y="840">被关进"政府围栏"——</text>
<text x="60" y="862">为隔离并压制成千上万流离失所者而设立的集中营。</text>
<text x="60" y="884">数十年后，若阿金被关押在巴尔巴塞纳殖民医院，</text>
<text x="60" y="906">在一本日记中写下自己的记忆、妄念与真相，</text>
<text x="60" y="928">这本日记与遗体一同隐藏了62年。</text>
<text x="60" y="950">1979年，当遗体被掘出时，日记重见天日。</text>
<text x="60" y="972">但与此同时，另一样东西也苏醒了。</text>
</g>

<g fill="#0d0b08" stroke="#3a2c18" stroke-width="1">
<rect x="710" y="400" width="220" height="140"/>
<polygon points="700,400 820,340 940,400"/>
