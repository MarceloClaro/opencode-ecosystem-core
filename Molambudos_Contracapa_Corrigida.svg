<text x="820" y="573" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#cbb17a">HOSPITAL COLÔNIA</text>
<text x="820" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#cbb17a">DE BARBACENA</text>
<rect x="720" y="608" width="200" height="46" fill="#1a140c" stroke="#6b5330" stroke-width="1"/>
<text x="820" y="627" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8a6d3b">60.000 MORTES</text>
<text x="820" y="644" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8a6d3b">ENTRE 1930 E 1980</text>
<g stroke="#3a2c18" stroke-width="1.5" fill="none">
<circle cx="700" cy="690" r="10"/><circle cx="726" cy="690" r="10"/><circle cx="752" cy="690" r="10"/><circle cx="778" cy="690" r="10"/><circle cx="804" cy="690" r="10"/><circle cx="830" cy="690" r="10"/><circle cx="856" cy="690" r="10"/><circle cx="882" cy="690" r="10"/><circle cx="908" cy="690" r="10"/><circle cx="934" cy="690" r="10"/>
</g>

<line x1="60" y1="1000" x2="990" y2="1000" stroke="#4a3a22" stroke-width="1" stroke-dasharray="1 8"/>
<text x="525" y="1024" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8a7350">DESTAQUES · HIGHLIGHTS · 亮点</text>

<g font-family="Georgia, serif" font-size="12.5" fill="#cfc2a0">
<text x="60" y="1058">• Uma história de amor, perda e</text>
<text x="72" y="1074">sobrevivência no sertão.</text>
<text x="60" y="1096">• Retrato sombrio dos campos de</text>
<text x="72" y="1112">concentração no Ceará.</text>
<text x="60" y="1134">• Os horrores reais do maior</text>
<text x="72" y="1150">hospício do Brasil.</text>
</g>
<g font-family="Georgia, serif" font-size="12.5" fill="#b7a780">
<text x="395" y="1058">• A story of love, loss, and</text>
<text x="407" y="1074">survival in the backlands.</text>
<text x="395" y="1096">• A dark portrait of the camps</text>
<text x="407" y="1112">in Ceará.</text>
<text x="395" y="1134">• The real horrors of Brazil's</text>
<text x="407" y="1150">largest asylum.</text>
</g>
<g font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#b7a780">
<text x="730" y="1058">• 一段关于荒原之爱、失去</text>
<text x="742" y="1076">与生存的故事。</text>
<text x="730" y="1098">• 对塞阿拉集中营的</text>
<text x="742" y="1116">阴郁刻画。</text>
<text x="730" y="1138">• 巴西最大精神病院的</text>
<text x="742" y="1156">真实恐怖。</text>
</g>

<rect x="60" y="1195" width="930" height="185" fill="#211109" stroke="#5a2e1f" stroke-width="1.5"/>
<g fill="#151009" stroke="#3a2c18" stroke-width="1.5">
<ellipse cx="140" cy="1287" rx="42" ry="30"/>
<circle cx="122" cy="1280" r="8" fill="#060402"/><circle cx="158" cy="1280" r="8" fill="#060402"/>
</g>
<g font-family="Georgia, serif" fill="#cfc2a0">
<text x="220" y="1235" font-size="17" font-weight="700" fill="#c96a4a" letter-spacing="2">CUIDADO</text>
<text x="220" y="1258" font-size="13">Este livro contém um ciclo de contaminação narrativa. Ao ler,</text>
<text x="220" y="1275">você se torna o Paciente 1.263.</text>
<text x="220" y="1300" font-size="17" font-weight="700" fill="#c96a4a" letter-spacing="2">WARNING</text>
<text x="220" y="1320" font-size="13" fill="#b7a780">By reading it, you become Patient 1,263.</text>
</g>
<text x="220" y="1350" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="16" font-weight="700" fill="#c96a4a" letter-spacing="2">警告</text>
<text x="220" y="1369" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#b7a780">一旦阅读，您将成为1,263号病人。</text>

<text x="525" y="1435" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#6b5330">"</text>
<g font-family="Georgia, serif" font-style="italic" text-anchor="middle" font-size="14.5">
<text x="525" y="1460" fill="#e8d9b5">Não é só a história de um menino. É o grito de um povo que</text>
<text x="525" y="1479" fill="#e8d9b5">foi silenciado. É o diário de uma dor que o Brasil enterrou vivo.</text>
<text x="525" y="1502" fill="#bfa876" font-size="13.5">This is not only the story of a boy. It is the cry of a people</text>
<text x="525" y="1519" fill="#bfa876" font-size="13.5">who were silenced. It is the diary of a pain Brazil buried alive.</text>
<text x="525" y="1545" fill="#bfa876" font-size="15" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-style="normal">这不仅仅是一个男孩的故事。这是一个被迫沉默的民族的呐喊。</text>
<text x="525" y="1566" fill="#bfa876" font-size="15" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-style="normal">这是一本将其活埋的痛苦日记。</text>
</g>

