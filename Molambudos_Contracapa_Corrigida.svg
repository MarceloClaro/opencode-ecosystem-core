<title>Molambudos - contracapa, textos corrigidos</title>
<desc>Contracapa do livro Molambudos com epigrafe, sinopse e destaques em portugues, ingles e chines, hospital colonia de Barbacena, aviso ao leitor, ISBN e creditos dos autores.</desc>
