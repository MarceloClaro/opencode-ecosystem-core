<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="120" fill="white"/>
  <!-- Evolution Registry bars -->
  <g fill="#4a90e2">
    <!-- R1-R100 (old) - lighter -->
    <rect x="10" y="25" width="90" height="70" rx="3"/>
    <!-- R101-R500 (medium) -->
    <rect x="110" y="20" width="390" height="80" rx="3"/>
    <!-- R501-R854 (recent) - darker -->
    <rect x="500" y="25" width="90" height="70" rx="3"/>
  </g>
  <!-- Bar labels -->
  <g fill="#2d3a4b" font-family="Arial" font-size="11">
    <text x="60" y="50" text-anchor="middle">R1-R100</text>
    <text x="305" y="65" text-anchor="middle">R101-R500</text>
    <text x="550" y="50" text-anchor="middle">R501-R854</text>
  </g>
  <!-- Total count annotation -->
  <g fill="#2d3a4b" font-family="Arial" font-size="12">
    <text x="300" y="100" text-anchor="middle">854 ciclos totais</text>
  </g>
  <!-- Timeline markers -->
  <g stroke="#666" stroke-width="1">
    <line x1="110" y1="15" x2="110" y2="105"/>
    <line x1="500" y1="15" x2="500" y2="105"/>
  </g>
  <!-- Title -->
  <text x="300" y="15" text-anchor="middle" font-family="Arial" font-size="14" fill="#2d3a4b">Evolution Registry: 854 Ciclos</text>
</svg>
