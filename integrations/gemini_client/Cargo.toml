[package]
name = "gemini-client"
version = "0.2.0"
edition = "2021"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
