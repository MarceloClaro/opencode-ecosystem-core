<text x="525" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#d8c9a3">Ela não é um monstro. Ela é uma consequência.</text>
<text x="525" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#bfa876">She is not a monster. She is a consequence.</text>
<text x="525" y="456" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="19" fill="#bfa876">她不是怪物。她是后果。</text>

