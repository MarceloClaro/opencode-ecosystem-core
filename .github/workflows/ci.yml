name: OpenCode Ecosystem Core CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Static lint (R448 safety surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run pinned Ruff checks
        run: |
          python -m ruff check --output-format=github --select E4,E7,E9,F \
            sdd/spec_engine.py \
            sdd/tdd_runner.py \
            sdd/tdd_history.py \
            integrations/deepmind/formal_verifier.py \
            integrations/deepmind/formal_safety_predicates.py \
            integrations/deepmind/alphaproof_engine.py \
            marceloclaro/orchestrator.py \
            mci/self_correction.py \
            publishing/production.py \
            tests/test_r448_hardening.py \
            tests/test_r448_installer_security.py \
            tests/test_r448_sdd_contracts.py \
            tests/test_r839_tdd_history.py \
            tests/test_r839_red_delivery.py \
            tests/test_r839_verifier_delivery.py \
            tests/test_r840_catalog_frontmatter_cache.py \
            tests/test_r448_documentation_reconciliation.py
      - name: Check Bash installer syntax
        run: |
          bash -n installer/common/install_clis.sh
          bash -n installer/linux/install.sh
          bash -n installer/macos/install.sh
          bash -n installer/windows/provision.sh
      - name: Reject dynamic evaluation in all reasoning modules
        run: |
          if rg -n '\beval\s*\(' reasoning --glob '*.py'; then
            echo 'Dynamic evaluation is prohibited in reasoning modules.'
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .opencode/package-lock.json
      - name: Install declared OpenCode dependencies
        working-directory: .opencode
        run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q --tb=short --timeout=120 --junitxml=reports/pytest.xml
        name: Run full test suite
      - run: python scripts/quality_report.py --junit reports/pytest.xml --output reports/quality.json
        name: Generate quality report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error

  package:
    name: Package Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [opencode-evosci, opencode-deep-research, opencode-peer-review]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m build packages/${{ matrix.package }}
        name: Build ${{ matrix.package }}
      - run: python -c "import sys; sys.path.insert(0, 'packages/${{ matrix.package }}'); __import__('${{ matrix.package }}'.replace('-', '_'))"
        name: Verify import
