name: Scientific Lab Native Runtime

on:
  push:
    branches: [main, develop, "feat/pesquisador-universal-v4.2-native-core"]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - "research/downloader.py"
      - "research/__init__.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "specs/SPEC-017-research.md"
      - "specs/SPEC-935-R469-pesquisador-universal-v42-native-runtime.md"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_scientific_lab_v42_native.py"
      - "tests/test_research.py"
      - ".github/workflows/scientific-lab.yml"
  pull_request:
    branches: [main]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - "research/downloader.py"
      - "research/__init__.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "specs/SPEC-017-research.md"
      - "specs/SPEC-935-R469-pesquisador-universal-v42-native-runtime.md"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_scientific_lab_v42_native.py"
      - "tests/test_research.py"
      - ".github/workflows/scientific-lab.yml"

permissions:
  contents: read

jobs:
  native-science:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_scientific_lab_v41_core_integration.py tests/test_scientific_lab_v42_native.py tests/test_research.py -q --tb=short --timeout=120
      - run: python -m marceloclaro.scientific_lab core-check
      - run: python -m marceloclaro.scientific_lab doctor
