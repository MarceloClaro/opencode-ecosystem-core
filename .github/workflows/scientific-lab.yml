name: Scientific Lab Core Bridge

on:
  push:
    branches: [main, develop, "feat/pesquisador-universal-v4.1-core"]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_restricted_resolver_optin.py"
      - "specs/SPEC-935-R470*.md"
      - ".github/workflows/scientific-lab.yml"
  pull_request:
    branches: [main]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_restricted_resolver_optin.py"
      - "specs/SPEC-935-R470*.md"
      - ".github/workflows/scientific-lab.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_scientific_lab_v41_core_integration.py tests/test_restricted_resolver_optin.py -q --tb=short --timeout=120
      - run: python -m marceloclaro.scientific_lab core-check
      - run: python -m marceloclaro.scientific_lab restricted --help

  supply-chain:
    runs-on: ubuntu-latest
    needs: bridge
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements-dev.txt
      - name: Check declared release constants (metadata only)
        run: python -m pytest tests/test_scientific_lab_v41_core_integration.py::test_release_constants_match_upstream_record -q
      - name: Verify restricted resolver fail-closed
        run: |
          python - <<'PY'
          import json, subprocess, sys
          result = subprocess.run([sys.executable, "-m", "marceloclaro.scientific_lab", "restricted", "--resolver", "test"], capture_output=True, text=True, timeout=20)
          assert result.returncode == 10, result
          report = json.loads(result.stdout)
          assert report["receipt"]["deny_code"] == "missing_enable", report
          assert report["receipt"]["decision"] == "denied" and report["receipt"]["enabled_effective"] is False, report
          assert report["download"] is None, report
          print("Restricted resolver: explicit denial confirmed")
          PY
