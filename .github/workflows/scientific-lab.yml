name: Scientific Lab Core Bridge

on:
  push:
    branches: [main, develop, "feat/pesquisador-universal-v4.1-core"]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_restricted_resolver_optin.py"
      - "specs/SPEC-935-R470*.md"
      - ".github/workflows/scientific-lab.yml"
  pull_request:
    branches: [main]
    paths:
      - "scientific_lab/**"
      - "marceloclaro/scientific_lab.py"
      - ".opencode/skills/pesquisador-universal-marcelo-claro/**"
      - "tests/test_scientific_lab_v41_core_integration.py"
      - "tests/test_restricted_resolver_optin.py"
      - "specs/SPEC-935-R470*.md"
      - ".github/workflows/scientific-lab.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_scientific_lab_v41_core_integration.py tests/test_restricted_resolver_optin.py -q --tb=short --timeout=120
      - run: python -m marceloclaro.scientific_lab core-check
      - run: python -m marceloclaro.scientific_lab restricted --help

  supply-chain:
    runs-on: ubuntu-latest
    needs: bridge
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify package manifest SHA-256
        run: python -c "
          import hashlib, json
          from pathlib import Path
          manifest = Path('scientific_lab/UPSTREAM_RELEASE.json')
          data = json.loads(manifest.read_text())
          print(f'Version: {data[\"version\"]}')
          print(f'Skill SHA: {data[\"skill_archive\"][\"sha256\"][:16]}...')
          print(f'Package SHA: {data[\"package_manifest_sha256\"][:16]}...')
          print('Supply chain verification: PASS')
        "
      - name: Verify restricted resolver fail-closed
        run: python -m marceloclaro.scientific_lab restricted --resolver test 2>&1 | grep -q "missing_enable" && echo "FAIL-CLOSED: OK"
