name: Aceite computacional científico local

on:
  push:
    branches: [main, master, develop, "codex/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-profile:
    name: Artigos e experimentos (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-scientific-profile.txt
      - run: python -m pip check
      - name: Execute o perfil enumerado com orçamento e recibos
        run: python scripts/validate_scientific_profile.py --output reports/scientific-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-profile-python-${{ matrix.python }}
          path: reports/scientific-profile/
          if-no-files-found: error

# Este job verifica o perfil indicado no recibo. Não constitui aprovação
# editorial, validação científica externa ou execução da suíte global.
