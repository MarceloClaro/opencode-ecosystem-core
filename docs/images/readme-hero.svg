<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenCode Ecosystem Core — evidência antes da narrativa</title>
  <desc id="hero-desc">Banner do Core: pesquisa e produção com agentes coordenados, contratos testáveis e revisão humana. Um painel ilustra fontes, contrato e evidência. Números de agentes e testes não fazem parte da imagem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100C22"/>
      <stop offset="0.55" stop-color="#15102B"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="violet-halo">
      <stop offset="0" stop-color="#7546D7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7546D7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231A3D"/>
      <stop offset="1" stop-color="#121629"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4A9FF"/>
      <stop offset="1" stop-color="#B7F45B"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#D9C5FF" stroke-opacity="0.065"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#background)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="170" cy="90" rx="440" ry="350" fill="url(#violet-halo)"/>
  <path d="M 64 44 H 120" stroke="#B7F45B" stroke-width="3" stroke-linecap="round"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="64" y="75" fill="#C8F47A" font-size="16" font-weight="700" letter-spacing="2.5">OPENCODE  /  ECOSYSTEM CORE</text>
    <text x="64" y="147" fill="#F8F7FF" font-size="56" font-weight="800" letter-spacing="-1.3">Evidência antes</text>
    <text x="64" y="211" fill="#F8F7FF" font-size="56" font-weight="800" letter-spacing="-1.3">da narrativa.</text>
    <text x="64" y="259" fill="#E6E0F4" font-size="20">Pesquisa e produção com agentes coordenados,</text>
    <text x="64" y="288" fill="#E6E0F4" font-size="20">contratos testáveis e revisão humana.</text>

    <text x="64" y="326" fill="#BDB2D2" font-size="16" font-weight="700" letter-spacing="1.8">CICLO DE TRABALHO</text>
    <g fill="#1C1731" stroke="#8875B3" stroke-width="1.2">
      <rect x="64" y="340" width="153" height="42" rx="13"/>
      <rect x="236" y="340" width="134" height="42" rx="13"/>
    </g>
    <rect x="389" y="340" width="145" height="42" rx="13" fill="#222B27" stroke="#A1CF64" stroke-width="1.2"/>
    <path d="M 221 361 h 10 m 143 0 h 10" fill="none" stroke="#B7F45B" stroke-width="2" stroke-linecap="round"/>
    <text x="140.5" y="367" text-anchor="middle" fill="#EEE8FF" font-size="16" font-weight="700">ESPECIFICAR</text>
    <text x="303" y="367" text-anchor="middle" fill="#EEE8FF" font-size="16" font-weight="700">EXECUTAR</text>
    <text x="461.5" y="367" text-anchor="middle" fill="#E3F8BC" font-size="16" font-weight="700">VERIFICAR</text>
  </g>

  <path d="M 702 55 V 365" stroke="#9F8EBF" stroke-opacity="0.22"/>
  <rect x="733" y="55" width="405" height="310" rx="24" fill="url(#panel)" stroke="#A495C2" stroke-opacity="0.38"/>
  <path d="M 756 87 v -8 q 0 -8 8 -8 h 8" fill="none" stroke="#B7F45B" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 789 146 V 290" stroke="url(#spine)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="789" cy="152" r="9" fill="#BBA4F5"/>
  <circle cx="789" cy="217" r="9" fill="#C4B5FD"/>
  <circle cx="789" cy="282" r="9" fill="#B7F45B"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="765" y="102" fill="#C8F47A" font-size="16" font-weight="700" letter-spacing="1.4">MARCELOCLARO / ORQUESTRAÇÃO</text>
    <text x="817" y="156" fill="#F6F3FF" font-size="20" font-weight="700">01  FONTES</text>
    <text x="817" y="180" fill="#D3CBE5" font-size="16">origem e limites declarados</text>
    <text x="817" y="221" fill="#F6F3FF" font-size="20" font-weight="700">02  CONTRATO</text>
    <text x="817" y="245" fill="#D3CBE5" font-size="16">critérios e testes locais</text>
    <text x="817" y="286" fill="#F6F3FF" font-size="20" font-weight="700">03  EVIDÊNCIA</text>
    <text x="817" y="310" fill="#D3CBE5" font-size="16">resultados rastreáveis</text>
    <text x="765" y="343" fill="#B9E78A" font-size="16" font-weight="700">DECISÃO HUMANA · NÃO AUTOMÁTICA</text>
  </g>
</svg>
