  <text x="80" y="206" fill="#f7f5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="70" font-weight="800">Pesquisa, agentes</text>
  <text x="80" y="282" fill="#f7f5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="70" font-weight="800">e evidência.</text>
  <text x="80" y="340" fill="#d8d1eb" font-family="DejaVu Sans, Arial, sans-serif" font-size="26">Em um único core auditável.</text>
  <text x="80" y="386" fill="#b9b1ce" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">Do tema ao artigo com validação humana — sem inventar citações, dados ou aceite.</text>
