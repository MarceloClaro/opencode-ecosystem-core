      <text x="1052" y="156" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">página + hash + aprovação</text>
    </g>
    <g>
      <rect x="48" y="196" width="190" height="58" rx="12" fill="#171126" stroke="#a3e635" stroke-opacity="0.65"/>
      <text x="143" y="220" text-anchor="middle" fill="#d9f99d">6. Integridade</text>
      <text x="143" y="240" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">retratações/correções</text>
    </g>
    <line x1="238" y1="225" x2="272" y2="225" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="274" y="196" width="190" height="58" rx="12" fill="#171126" stroke="#a3e635" stroke-opacity="0.65"/>
      <text x="369" y="220" text-anchor="middle" fill="#d9f99d">7. Meta-análise</text>
      <text x="369" y="240" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">REML/DL · I² · predição</text>
    </g>
    <line x1="464" y1="225" x2="498" y2="225" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="500" y="196" width="190" height="58" rx="12" fill="#171126" stroke="#a3e635" stroke-opacity="0.65"/>
      <text x="595" y="220" text-anchor="middle" fill="#d9f99d">8. RoB + GRADE</text>
      <text x="595" y="240" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">sugestão não autoritativa</text>
    </g>
    <line x1="690" y1="225" x2="724" y2="225" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="726" y="196" width="190" height="58" rx="12" fill="#171126" stroke="#a3e635" stroke-opacity="0.65"/>
      <text x="821" y="220" text-anchor="middle" fill="#d9f99d">9. Manuscrito</text>
      <text x="821" y="240" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">IMRaD + auditoria</text>
    </g>
    <line x1="916" y1="225" x2="950" y2="225" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="952" y="196" width="200" height="58" rx="12" fill="#171126" stroke="#a3e635" stroke-opacity="0.65"/>
      <text x="1052" y="220" text-anchor="middle" fill="#d9f99d">10. Submissão</text>
      <text x="1052" y="240" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">fail-closed + gate humano</text>
    </g>
  </g>
  <text x="48" y="296" fill="#8f86a8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Nenhuma etapa declara verdade, aceite editorial ou publicação sem artefato humano verificável.</text>
</svg>