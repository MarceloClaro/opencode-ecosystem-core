<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Pipeline científico R1051-R1054">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0912"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg2)" stroke="#a78bfa" stroke-opacity="0.25"/>
  <text x="48" y="52" fill="#f7f5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800">Pesquisador científico R1051–R1054</text>
  <text x="48" y="78" fill="#b9b1ce" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Do tema ao pacote de submissão, com evidência literal e validação humana.</text>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">
    <g>
