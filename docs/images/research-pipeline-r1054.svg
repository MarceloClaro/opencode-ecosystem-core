      <text x="143" y="136" text-anchor="middle" fill="#c4b5fd">1. Tema + pergunta</text>
      <text x="143" y="156" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">explícita ou provisória</text>
    </g>
    <line x1="238" y1="141" x2="272" y2="141" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="274" y="112" width="190" height="58" rx="12" fill="#171126" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="369" y="136" text-anchor="middle" fill="#c4b5fd">2. Contrato</text>
      <text x="369" y="156" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">fontes, filtros, budget</text>
    </g>
    <line x1="464" y1="141" x2="498" y2="141" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="500" y="112" width="190" height="58" rx="12" fill="#171126" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="595" y="136" text-anchor="middle" fill="#c4b5fd">3. Busca + dedupe</text>
      <text x="595" y="156" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">9 plataformas nativas</text>
    </g>
    <line x1="690" y1="141" x2="724" y2="141" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="726" y="112" width="190" height="58" rx="12" fill="#171126" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="821" y="136" text-anchor="middle" fill="#c4b5fd">4. Triagem</text>
      <text x="821" y="156" text-anchor="middle" fill="#8f86a8" font-size="11" font-weight="400">humana + conflitos</text>
    </g>
    <line x1="916" y1="141" x2="950" y2="141" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow)"/>
